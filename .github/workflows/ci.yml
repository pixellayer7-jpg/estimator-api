name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Explicit bash adds pipefail, so a failing test still fails the step through tee.
      - shell: bash
        run: npm run test:coverage | tee coverage.txt
      - if: ${{ !cancelled() && hashFiles('coverage.txt') != '' }}
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            grep -E '^# .*\|' coverage.txt | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
