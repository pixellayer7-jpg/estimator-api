# Deploy on Render: https://render.com — New → Blueprint
services:
  - type: web
    name: pixellayer-estimator-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: estimator-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: LIST_QUOTES_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
