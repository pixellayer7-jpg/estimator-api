services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATA_DIR: /var/data
      LIST_QUOTES_TOKEN: dev-token
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,https://pixellayer7-jpg.github.io
    volumes:
      - estimator-data:/var/data

volumes:
  estimator-data:
